[platformio]
default_envs = demo
src_dir = .
include_dir = ../../include
core_dir = ../../.tools/platformio

[env:demo]
platform = platformio/espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus @ 1.0.3
    marcoschwartz/LiquidCrystal_I2C @ 1.1.4
build_src_filter = +<main.cpp>
build_flags = -Wall -Wextra -DDEMO_MODE=1 -DSWITCH_BUTTONS=1
