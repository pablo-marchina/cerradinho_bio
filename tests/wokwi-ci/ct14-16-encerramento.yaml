# CT14-CT16 (V2): recusas de encerramento, encerramento valido e reutilizacao, todos com
# BTN_CICLO segurado 3 s. CT15: no V2 o mesmo gesto encerra o ciclo ativo; o log nao pode
# ter VINCULO_RECUSADO.
name: CT14-CT16 V2 - encerramento e reutilizacao do ciclo
version: 1
steps:
  - wait-serial: '"type":"STATUS"'
  - delay: 500ms
  # Vinculo (RF003): o dispositivo liga sem ciclo; CICLO segurado 3 s abre o ciclo 1.
  - set-control: { part-id: btn_ciclo, control: pressed, value: 1 }
  - wait-serial: '"type":"CICLO_INICIADO"'
  - set-control: { part-id: btn_ciclo, control: pressed, value: 0 }
  # CT16 B: lacre fechado, sem NF de retorno.
  - set-control: { part-id: btn_ciclo, control: pressed, value: 1 }
  - wait-serial: '"type":"ENCERRAMENTO_RECUSADO"'
  - set-control: { part-id: btn_ciclo, control: pressed, value: 0 }
  - delay: 300ms
  # CT16 A: NF lancada, lacre aberto.
  - write-serial: "NF\n"
  - wait-serial: '"type":"NF_RETORNO_LANCADA"'
  - set-control: { part-id: seal, control: value, value: 1 }
  - wait-serial: '"type":"VIOLACAO_LACRE"'
  - set-control: { part-id: btn_ciclo, control: pressed, value: 1 }
  - wait-serial: '"type":"ENCERRAMENTO_RECUSADO"'
  - set-control: { part-id: btn_ciclo, control: pressed, value: 0 }
  - set-control: { part-id: seal, control: value, value: 0 }
  - wait-serial: '"type":"LACRE_FECHADO"'
  - delay: 300ms
  # CT14: encerramento valido e novo ciclo.
  - set-control: { part-id: btn_ciclo, control: pressed, value: 1 }
  - wait-serial: '"type":"CICLO_ENCERRADO"'
  - set-control: { part-id: btn_ciclo, control: pressed, value: 0 }
  - delay: 300ms
  - take-screenshot: { part-id: lcd, save-to: ../../build/wokwi-ct/ct14-lcd-encerrado.png }
  - delay: 500ms
  - set-control: { part-id: btn_ciclo, control: pressed, value: 1 }
  - wait-serial: '"type":"CICLO_INICIADO"'
  - set-control: { part-id: btn_ciclo, control: pressed, value: 0 }
  - delay: 300ms
  # CT15: novo gesto com ciclo ativo cai no encerramento (NF do ciclo 2 ausente).
  - set-control: { part-id: btn_ciclo, control: pressed, value: 1 }
  - wait-serial: '"type":"ENCERRAMENTO_RECUSADO"'
  - set-control: { part-id: btn_ciclo, control: pressed, value: 0 }
  - delay: 500ms
