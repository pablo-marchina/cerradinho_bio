name: GuaraTracking V2 - boot e autorizacao com 3 s (CT basico)
version: 1
author: Grupo G01
steps:
  - wait-serial: '[boot] ESP32 executando'
  - wait-serial: '[comandos] NF = lanca NF de retorno'
  - set-control:
      part-id: btn_autorizar
      name: pressed
      value: 1
  # V2: segurado, o registro sai ao completar 3 s.
  - wait-serial: 'AUTORIZACAO_REGISTRADA'
  - set-control:
      part-id: btn_autorizar
      name: pressed
      value: 0
