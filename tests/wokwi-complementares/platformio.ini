[platformio]
default_envs = demo
src_dir = .
include_dir = ../../include
core_dir = ../../.tools/platformio

[env:demo]
platform = platformio/espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../.pio/libdeps/demo
build_src_filter = +<main.cpp>
build_flags = -Wall -Wextra -DDEMO_MODE=1
