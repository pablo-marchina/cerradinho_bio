[platformio]
default_envs = demo
src_dir = src/firmware
core_dir = .tools/platformio

[env]
platform = platformio/espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus @ 1.0.3
    marcoschwartz/LiquidCrystal_I2C @ 1.1.4
build_flags = -Wall -Wextra
build_src_filter = +<main.cpp>

[env:demo]
build_flags = ${env.build_flags} -DDEMO_MODE=1

[env:weekly]
build_flags = ${env.build_flags} -DDEMO_MODE=0

; Placa fisica (DevKitC V4 na protoboard dupla): igual ao demo, com botoes no lugar das chaves.
[env:bancada]
build_flags = ${env.build_flags} -DDEMO_MODE=1 -DSWITCH_BUTTONS=1
