  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

Fa><a href=\"#icones\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#F7F4F1;\">06 Ícones<\u002Fa><a href=\"#apresentacoes\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#F7F4F1;\">07 Apresentações<\u002Fa><a href=\"#arduino\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#F7F4F1;\">08 Arduino<\u002Fa><a href=\"#site\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#F7F4F1;\">09 Site<\u002Fa><a href=\"#voz\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#F7F4F1;\">10 Tom de voz<\u002Fa><a href=\"#solarpunk\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#F7F4F1;\">11 Paleta solarpunk<\u002Fa><a href=\"#sol\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#F7F4F1;\">12 Sol<\u002Fa><a href=\"#cenas\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#F7F4F1;\">13 Cenas<\u002Fa><a href=\"#elementos-cena\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#F7F4F1;\">14 Elementos de cena<\u002Fa><a href=\"#telas\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#F7F4F1;\">15 Telas<\u002Fa><a href=\"#pitch\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#F7F4F1;\">16 Pitch solarpunk<\u002Fa><\u002Fnav>\n  <\u002Fheader>\n  <section id=\"logo\" style=\"display:flex;flex-direction:column;gap:32px;padding:72px 0;border-top:1px solid #D6D1CC;\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">01 · Marca<\u002Fdiv><h2 style=\"margin:0;font-size:40px;font-weight:600;line-height:1.05;\">Logo<\u002Fh2><p style=\"margin:0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.55;color:#4A4441;text-wrap:pretty;\">Três peças formam a marca. A <b>10b<\u002Fb> é a assinatura principal: o guará-LED aceso ao lado do nome. A <b>11a<\u002Fb> é a versão com sonar, para capas, aberturas e telas de carregamento. A <b>10e<\u002Fb> é o sistema de estados, usado sempre que for preciso mostrar o status de um dispositivo.<\u002Fp><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px;\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;min-height:260px;\"><div style=\"display:flex;align-items:flex-end;gap:11px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"118\" height=\"150\" style=\"display:block;flex:none;\"><use href=\"#c_blink\"><\u002Fuse><\u002Fsvg><div style=\"margin-bottom:8px;\"><span style=\"font-size:62px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#161414;white-space:nowrap;\">Guará<span style=\"font-weight:500;color:#C8232C;\">tracking<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\"><b>Principal (10b).<\u002Fb> Guará-LED aceso e o nome. Em tela, os raios piscam a cada 0,7 s; impresso, ficam acesos.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;min-height:260px;\"><svg sc-camel-view-box=\"0 0 600 250\" width=\"480\" height=\"200\" style=\"display:block;\"><use href=\"#sonar\" x=\"13\" y=\"183\" width=\"180\" height=\"48\"><\u002Fuse><use href=\"#c_led_on\" x=\"46\" y=\"46\" width=\"125.7\" height=\"160\"><\u002Fuse><text x=\"184\" y=\"178\" font-family=\"Fredoka, sans-serif\" font-size=\"58\" font-weight=\"600\" letter-spacing=\"-0.6\" fill=\"#161414\">Guará<tspan font-weight=\"500\" fill=\"#C8232C\">tracking<\u002Ftspan><\u002Ftext><\u002Fsvg><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\"><b>Sonar (11a).<\u002Fb> As ondas saem dos pés em loop de 2,4 s. Use em capas, vinhetas e telas de abertura, uma vez por material.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#161414;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;min-height:260px;\"><div style=\"display:flex;align-items:flex-end;gap:11px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"118\" height=\"150\" style=\"display:block;flex:none;\"><use href=\"#c_blinkK\"><\u002Fuse><\u002Fsvg><div style=\"margin-bottom:8px;\"><span style=\"font-size:62px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#F7F4F1;white-space:nowrap;\">Guará<span style=\"font-weight:500;color:#C8232C;\">tracking<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\"><b>Fundo preto.<\u002Fb> Bico, olhos e pernas ficam brancos; o corpo e \"tracking\" continuam vermelhos.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#C8232C;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;min-height:260px;\"><div style=\"display:flex;align-items:flex-end;gap:11px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"118\" height=\"150\" style=\"display:block;flex:none;\"><use href=\"#c_led_onR\"><\u002Fuse><\u002Fsvg><div style=\"margin-bottom:8px;\"><span style=\"font-size:62px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#F7F4F1;white-space:nowrap;\">Guará<span style=\"font-weight:500;color:#161414;\">tracking<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\"><b>Fundo vermelho.<\u002Fb> Só em peças de destaque, como capa ou encerramento. O corpo do LED e \"Guará\" ficam brancos; bico, pernas e \"tracking\" ficam pretos.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;\"><div style=\"position:relative;padding:34px;outline:2px dashed #C8232C;outline-offset:-2px;\"><div style=\"display:flex;align-items:flex-end;gap:8px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"86\" height=\"110\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><div style=\"margin-bottom:6px;\"><span style=\"font-size:46px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#161414;white-space:nowrap;\">Guará<span style=\"font-weight:500;color:#C8232C;\">tracking<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"position:absolute;left:0;top:0;width:34px;height:34px;background:repeating-linear-gradient(45deg,#C8232C22 0 4px,transparent 4px 8px);\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\"><b>Área de proteção:<\u002Fb> a altura da base do LED (a faixa larga embaixo do corpo) multiplicada por 3, em todos os lados. Nada entra nesse espaço.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;\"><div style=\"display:flex;gap:28px;align-items:flex-end;\"><div style=\"display:flex;align-items:flex-end;gap:3px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"31\" height=\"40\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><div style=\"margin-bottom:2px;\"><span style=\"font-size:17px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#161414;white-space:nowrap;\">Guará<span style=\"font-weight:500;color:#C8232C;\">tracking<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"22\" height=\"28\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\"><b>Tamanho mínimo:<\u002Fb> logo horizontal com 140 px de largura em tela (35 mm impresso). Ícone sozinho com 24 px de altura (8 mm). Abaixo disso, use só o ícone.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;\"><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;\"><div style=\"transform:scaleX(1.5);\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"39\" height=\"50\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C8232C;\">✕ esticar<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"39\" height=\"50\" style=\"filter:hue-rotate(140deg);\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C8232C;\">✕ outra cor<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;\"><div style=\"transform:rotate(-20deg);\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"39\" height=\"50\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C8232C;\">✕ girar<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;\"><div style=\"background:repeating-linear-gradient(45deg,#C8232C 0 6px,#D89B2B 6px 12px);padding:4px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"33\" height=\"42\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#C8232C;\">✕ fundo carregado<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\"><b>Não fazer:<\u002Fb> esticar, trocar as cores, girar, aplicar sobre foto ou textura sem uma área lisa, ou tirar o bico.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:20px;padding-top:24px;border-top:1px dashed #D6D1CC;\"><div style=\"display:flex;flex-direction:column;gap:8px;max-width:760px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">Opções em teste<\u002Fdiv><div style=\"font-size:26px;font-weight:600;\">Nome em vermelho e verde, e bico tangente ao LED<\u002Fdiv><p style=\"margin:0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:15.5px;line-height:1.55;color:#4A4441;\">Duas mudanças que podem ser combinadas: \"Guará\" em vermelho e \"tracking\" em verde-lavoura, e um bico curvo com a base encostada na lateral do LED.<\u002Fp><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px;\">\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;min-height:240px;\"><div style=\"display:flex;align-items:flex-end;gap:11px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"110\" height=\"140\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><div style=\"margin-bottom:8px;\"><span style=\"font-size:58px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#C8232C;white-space:nowrap;\">Guará<span style=\"font-weight:500;color:#2F6B45;\">tracking<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;background:#161414;color:#F7F4F1;padding:3px 9px;border-radius:5px;\">A<\u002Fspan><span style=\"font-size:18px;font-weight:600;\">Nome vermelho e verde<\u002Fspan><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">\"Guará\" em vermelho guará (#C8232C) e \"tracking\" em lavoura escura (#2F6B45). Liga a marca à lavoura sem mudar o símbolo.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#161414;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;min-height:240px;\"><div style=\"display:flex;align-items:flex-end;gap:11px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"110\" height=\"140\" style=\"display:block;flex:none;\"><use href=\"#c_led_onK\"><\u002Fuse><\u002Fsvg><div style=\"margin-bottom:8px;\"><span style=\"font-size:58px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#C8232C;white-space:nowrap;\">Guará<span style=\"font-weight:500;color:#6FA862;\">tracking<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;background:#161414;color:#F7F4F1;padding:3px 9px;border-radius:5px;\">A · escuro<\u002Fspan><span style=\"font-size:18px;font-weight:600;\">Nome vermelho e verde sobre semente<\u002Fspan><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">Sobre fundo escuro, \"tracking\" usa a lavoura clara (#6FA862) para manter o contraste.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;padding:32px;display:flex;align-items:flex-end;justify-content:center;gap:56px;min-height:240px;flex-wrap:wrap;\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"140\" height=\"178\" style=\"display:block;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#6B6460;\">BICO ATUAL<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"140\" height=\"178\" style=\"display:block;\"><use href=\"#c_tan\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#6B6460;\">BICO TANGENTE<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;background:#161414;color:#F7F4F1;padding:3px 9px;border-radius:5px;\">B<\u002Fspan><span style=\"font-size:18px;font-weight:600;\">Bico tangente<\u002Fspan><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">O bico mantém a curva da 10b, mas começa fora do LED: a base é reta e fica encostada na lateral, e o bico sai na horizontal e se curva para baixo.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;min-height:240px;\"><div style=\"display:flex;align-items:flex-end;gap:11px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"110\" height=\"140\" style=\"display:block;flex:none;\"><use href=\"#c_tan\"><\u002Fuse><\u002Fsvg><div style=\"margin-bottom:8px;\"><span style=\"font-size:58px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#161414;white-space:nowrap;\">Guará<span style=\"font-weight:500;color:#C8232C;\">tracking<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;background:#161414;color:#F7F4F1;padding:3px 9px;border-radius:5px;\">B · nome<\u002Fspan><span style=\"font-size:18px;font-weight:600;\">Bico tangente com o nome atual<\u002Fspan><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">Mesmo nome da 10b, com o símbolo novo.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;min-height:240px;\"><div style=\"display:flex;align-items:flex-end;gap:11px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"110\" height=\"140\" style=\"display:block;flex:none;\"><use href=\"#c_tan\"><\u002Fuse><\u002Fsvg><div style=\"margin-bottom:8px;\"><span style=\"font-size:58px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#C8232C;white-space:nowrap;\">Guará<span style=\"font-weight:500;color:#2F6B45;\">tracking<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;background:#161414;color:#F7F4F1;padding:3px 9px;border-radius:5px;\">A + B<\u002Fspan><span style=\"font-size:18px;font-weight:600;\">Bico tangente com nome vermelho e verde<\u002Fspan><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">As duas mudanças juntas.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#161414;border-radius:14px;padding:36px;display:flex;align-items:center;justify-content:center;min-height:240px;\"><div style=\"display:flex;align-items:flex-end;gap:11px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"110\" height=\"140\" style=\"display:block;flex:none;\"><use href=\"#c_tanK\"><\u002Fuse><\u002Fsvg><div style=\"margin-bottom:8px;\"><span style=\"font-size:58px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#C8232C;white-space:nowrap;\">Guará<span style=\"font-weight:500;color:#6FA862;\">tracking<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;background:#161414;color:#F7F4F1;padding:3px 9px;border-radius:5px;\">A + B · escuro<\u002Fspan><span style=\"font-size:18px;font-weight:600;\">Combinação sobre semente<\u002Fspan><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">Pernas, olhos e bico em polpa, \"tracking\" em lavoura clara.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n  <section id=\"estados\" style=\"display:flex;flex-direction:column;gap:32px;padding:72px 0;border-top:1px solid #D6D1CC;\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">02 · Sistema<\u002Fdiv><h2 style=\"margin:0;font-size:40px;font-weight:600;line-height:1.05;\">Estados do dispositivo (10e)<\u002Fh2><p style=\"margin:0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.55;color:#4A4441;text-wrap:pretty;\">O mesmo guará representa o estado real do aparelho. Use igual no painel, nos slides e no LED físico da placa.<\u002Fp><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px;\">\n    <div style=\"background:#F7F4F1;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"height:130px;display:flex;align-items:flex-end;justify-content:center;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"94\" height=\"120\" style=\"display:block;flex:none;\"><use href=\"#c_led_off\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-size:20px;font-weight:600;\">Desligado<\u002Fdiv>\n      <div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;\">Contorno preto, olhos fechados. Sem energia ou fora de uso.<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#161414;background:#ECE9E5;padding:6px 8px;border-radius:6px;\">LED apagado<\u002Fdiv>\n    <\u002Fdiv><div style=\"background:#F7F4F1;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"height:130px;display:flex;align-items:flex-end;justify-content:center;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"94\" height=\"120\" style=\"display:block;flex:none;\"><use href=\"#c_led\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-size:20px;font-weight:600;\">Ligado<\u002Fdiv>\n      <div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;\">Corpo vermelho, olhos abertos. Com energia, aguardando o envio.<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#161414;background:#ECE9E5;padding:6px 8px;border-radius:6px;\">LED aceso fixo<\u002Fdiv>\n    <\u002Fdiv><div style=\"background:#F7F4F1;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"height:130px;display:flex;align-items:flex-end;justify-content:center;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"94\" height=\"120\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-size:20px;font-weight:600;\">Transmitindo<\u002Fdiv>\n      <div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;\">Raios acesos. Enviando localização ou status.<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#161414;background:#ECE9E5;padding:6px 8px;border-radius:6px;\">Pisca 700 ms aceso / 700 ms apagado<\u002Fdiv>\n    <\u002Fdiv><div style=\"background:#F7F4F1;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"height:130px;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 0 0 #C8232C);\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"94\" height=\"120\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-size:20px;font-weight:600;\">Alerta<\u002Fdiv>\n      <div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;\">Raios acesos, ritmo rápido. Lacre rompido ou prazo de 150 dias vencido.<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#161414;background:#ECE9E5;padding:6px 8px;border-radius:6px;\">Pisca 150 ms / 150 ms<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fsection>\n  <section id=\"cores\" style=\"display:flex;flex-direction:column;gap:32px;padding:72px 0;border-top:1px solid #D6D1CC;\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">03 · Cores<\u002Fdiv><h2 style=\"margin:0;font-size:40px;font-weight:600;line-height:1.05;\">Paleta guará e guaraná<\u002Fh2><p style=\"margin:0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.55;color:#4A4441;text-wrap:pretty;\">A fruta do guaraná aberta tem as mesmas três cores do guará: casca vermelha, semente preta e polpa branca. Essas três formam a base da marca. As cores do cerrado e de status entram em pouca quantidade.<\u002Fp><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:16px;\">\n    <div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;grid-column:span 2;\">\n    <div style=\"height:180px;background:#C8232C;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#F7F4F1;\">#C8232C<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Vermelho guará<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Casca do guaraná. A cor da marca: o corpo da ave, \"tracking\", destaques e o sol.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\">\n    <div style=\"height:120px;background:#161414;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#F7F4F1;\">#161414<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Semente<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Textos, bico, ícones e fundos escuros.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\">\n    <div style=\"height:120px;background:#F7F4F1;box-shadow:inset 0 0 0 1px #D6D1CC;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#161414;\">#F7F4F1<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Polpa<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Fundo principal de slides e telas.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">Apoio · cerrado<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:16px;\">\n    <div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\">\n    <div style=\"height:120px;background:#8F1820;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#F7F4F1;\">#8F1820<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Urucum<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Vermelho escuro para sombras, gráficos e estado pressionado.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\">\n    <div style=\"height:120px;background:#A65A2E;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#F7F4F1;\">#A65A2E<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Terra<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Solo do cerrado. Ilustrações, mapas e fundos de seção.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\">\n    <div style=\"height:120px;background:#D6D1CC;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#161414;\">#D6D1CC<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Areia<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Linhas, divisórias e grade de pontos.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\">\n    <div style=\"height:120px;background:#6B6460;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#F7F4F1;\">#6B6460<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Pedra<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Legendas e texto secundário.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">Status · só em dados<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:16px;\">\n    <div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\">\n    <div style=\"height:120px;background:#3F7D4E;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#F7F4F1;\">#3F7D4E<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Folha<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Sinal OK, dentro do prazo. A folha do guaraná.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\">\n    <div style=\"height:120px;background:#D89B2B;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#161414;\">#D89B2B<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Pequi<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Atenção: perto do prazo, bateria baixa.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\">\n    <div style=\"height:120px;background:#C8232C;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#F7F4F1;\">#C8232C<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Guará<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Alerta: lacre rompido ou prazo vencido.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:15px;line-height:1.55;color:#4A4441;max-width:760px;text-wrap:pretty;\"><b>Proporção num slide:<\u002Fb> cerca de 70% polpa, 20% semente e 10% vermelho. O vermelho funciona melhor quando aparece pouco. Texto vermelho só em títulos ou números grandes, a partir de 32 px.<\u002Fdiv><\u002Fsection>\n  <section id=\"tipografia\" style=\"display:flex;flex-direction:column;gap:32px;padding:72px 0;border-top:1px solid #D6D1CC;\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">04 · Tipografia<\u002Fdiv><h2 style=\"margin:0;font-size:40px;font-weight:600;line-height:1.05;\">Três famílias<\u002Fh2><p style=\"margin:0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.55;color:#4A4441;text-wrap:pretty;\"><b>Fredoka<\u002Fb> é a voz da marca: redonda, como o guará-LED. <b>Atkinson Hyperlegible<\u002Fb> é para ler, porque foi feita para alta legibilidade. <b>JetBrains Mono<\u002Fb> é para dados, código e tudo que sai da placa. Todas são gratuitas no Google Fonts.<\u002Fp><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;\">\n    <div style=\"background:#F7F4F1;border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:8px;\"><div style=\"font-size:72px;font-weight:600;line-height:1;\">Aa<\u002Fdiv><div style=\"font-size:20px;font-weight:600;\">Fredoka<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;color:#4A4441;\">600 para títulos e marca · 500 para subtítulos<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4F1;border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:8px;\"><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:72px;font-weight:700;line-height:1;\">Aa<\u002Fdiv><div style=\"font-size:20px;font-weight:600;\">Atkinson Hyperlegible<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;color:#4A4441;\">400 para texto · 700 para ênfase<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4F1;border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:8px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:64px;line-height:1.1;\">Aa<\u002Fdiv><div style=\"font-size:20px;font-weight:600;\">JetBrains Mono<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;color:#4A4441;\">400 para dados, rótulos e código Arduino<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">Escala para slides 1920 × 1080<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:24px;align-items:baseline;padding:18px 0;border-bottom:1px solid #D6D1CC;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;color:#6B6460;\">Display<br>Fredoka 600 · 120 px · entrelinha 1.0<\u002Fdiv><div style=\"font-size:72px;font-weight:600;line-height:1;color:#C8232C;\">150 dias<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:24px;align-items:baseline;padding:18px 0;border-bottom:1px solid #D6D1CC;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;color:#6B6460;\">Título<br>Fredoka 600 · 80 px · 1.05<\u002Fdiv><div style=\"font-size:48px;font-weight:600;line-height:1.05;\">Onde está cada equipamento<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:24px;align-items:baseline;padding:18px 0;border-bottom:1px solid #D6D1CC;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;color:#6B6460;\">Subtítulo<br>Fredoka 500 · 48 px · 1.15<\u002Fdiv><div style=\"font-size:30px;font-weight:500;line-height:1.15;\">Rastreamento em manutenção externa<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:24px;align-items:baseline;padding:18px 0;border-bottom:1px solid #D6D1CC;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;color:#6B6460;\">Texto<br>Atkinson 400 · 32 px · 1.4<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:20px;line-height:1.4;\">O dispositivo envia a última localização válida uma vez por semana.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:24px;align-items:baseline;padding:18px 0;border-bottom:1px solid #D6D1CC;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;color:#6B6460;\">Legenda<br>Atkinson 400 · 24 px · 1.4<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:15px;line-height:1.4;color:#6B6460;\">Fonte: dados da última safra.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:24px;align-items:baseline;padding:18px 0;border-bottom:1px solid #D6D1CC;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;color:#6B6460;\">Rótulo / dado<br>JetBrains Mono · 24 px · caixa alta, +8%<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.08em;\">LACRE · OK · 12 DIAS<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:15px;line-height:1.55;color:#4A4441;max-width:760px;\">No site, use metade dos valores (título 40 px, texto 17 px). Nunca use texto menor que 24 px num slide.<\u002Fdiv><\u002Fsection>\n  <section id=\"grafismos\" style=\"display:flex;flex-direction:column;gap:32px;padding:72px 0;border-top:1px solid #D6D1CC;\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">05 · Elementos<\u002Fdiv><h2 style=\"margin:0;font-size:40px;font-weight:600;line-height:1.05;\">Grafismos<\u002Fh2><p style=\"margin:0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.55;color:#4A4441;text-wrap:pretty;\">Elementos de apoio para compor slides, telas e peças. Use um ou dois por peça, nunca todos juntos.<\u002Fp><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px 20px;\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;\"><svg sc-camel-view-box=\"-10 -6 440 52\" width=\"420\" height=\"50\" style=\"display:block;width:90%;max-width:420px;height:auto;\"><use href=\"#footK\" x=\"0\" y=\"14\" width=\"16\" height=\"20\" transform=\"rotate(90 8 24)\"><\u002Fuse><use href=\"#footK\" x=\"30\" y=\"0\" width=\"16\" height=\"20\" transform=\"rotate(90 38 10)\"><\u002Fuse><use href=\"#footK\" x=\"60\" y=\"14\" width=\"16\" height=\"20\" transform=\"rotate(90 68 24)\"><\u002Fuse><use href=\"#footK\" x=\"90\" y=\"0\" width=\"16\" height=\"20\" transform=\"rotate(90 98 10)\"><\u002Fuse><use href=\"#footK\" x=\"120\" y=\"14\" width=\"16\" height=\"20\" transform=\"rotate(90 128 24)\"><\u002Fuse><use href=\"#footK\" x=\"150\" y=\"0\" width=\"16\" height=\"20\" transform=\"rotate(90 158 10)\"><\u002Fuse><use href=\"#footK\" x=\"180\" y=\"14\" width=\"16\" height=\"20\" transform=\"rotate(90 188 24)\"><\u002Fuse><use href=\"#footK\" x=\"210\" y=\"0\" width=\"16\" height=\"20\" transform=\"rotate(90 218 10)\"><\u002Fuse><circle cx=\"240\" cy=\"24\" r=\"3.2\" fill=\"#C8232C\"><\u002Fcircle><circle cx=\"260\" cy=\"10\" r=\"3.2\" fill=\"#C8232C\"><\u002Fcircle><circle cx=\"280\" cy=\"24\" r=\"3.2\" fill=\"#C8232C\"><\u002Fcircle><circle cx=\"300\" cy=\"10\" r=\"3.2\" fill=\"#C8232C\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div style=\"font-size:17px;font-weight:600;\">Pegadas<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">Trilha de pegadas de guará que termina em pontos vermelhos de dados. Use em divisórias, linhas do tempo e para indicar percurso. Sempre na horizontal, da esquerda para a direita.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;\"><svg sc-camel-view-box=\"0 0 300 160\" width=\"300\" height=\"160\"><rect width=\"300\" height=\"160\" fill=\"url(#dots)\"><\u002Frect><circle cx=\"152\" cy=\"72\" r=\"6\" fill=\"#C8232C\"><\u002Fcircle><circle cx=\"232\" cy=\"120\" r=\"6\" fill=\"#C8232C\"><\u002Fcircle><path d=\"M152 72 L200 72 L232 120\" fill=\"none\" stroke=\"#C8232C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:17px;font-weight:600;\">Pontos (protoboard)<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">Grade de pontos a cada 16 px, como os furos da protoboard. Serve de fundo para diagramas; as ligações seguem a grade, com cantos de 45°.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;\"><svg sc-camel-view-box=\"0 0 300 180\" width=\"300\" height=\"180\"><circle cx=\"150\" cy=\"110\" r=\"78\" fill=\"#C8232C\"><\u002Fcircle><rect x=\"0\" y=\"128\" width=\"300\" height=\"52\" fill=\"#F7F4F1\"><\u002Frect><path d=\"M0 128 H300\" stroke=\"#161414\" stroke-width=\"3\"><\u002Fpath><use href=\"#buriti\" x=\"64\" y=\"60\" width=\"42\" height=\"70\" style=\"color:#161414;\"><\u002Fuse><use href=\"#buriti\" x=\"200\" y=\"76\" width=\"32\" height=\"54\" style=\"color:#161414;\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"font-size:17px;font-weight:600;\">Sol vermelho do cerrado<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">Um círculo vermelho cortado pela linha do horizonte, com buritis. Fundo para capa e encerramento. O sol é sempre um círculo liso, sem raios.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;\"><svg sc-camel-view-box=\"0 0 300 160\" width=\"300\" height=\"160\"><use href=\"#sonar\" x=\"30\" y=\"40\" width=\"240\" height=\"64\"><\u002Fuse><ellipse cx=\"150\" cy=\"72\" rx=\"9\" ry=\"3\" fill=\"#C8232C\"><\u002Fellipse><\u002Fsvg><\u002Fdiv><div style=\"font-size:17px;font-weight:600;\">Sonar<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">As ondas da 11a. Marcam um ponto de localização em mapas e diagramas. Em vídeo e tela, animadas; impressas, use três ondas paradas.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;\"><svg sc-camel-view-box=\"0 0 300 110\" width=\"300\" height=\"110\"><rect x=\"10\" y=\"20\" width=\"280\" height=\"12\" fill=\"url(#zz)\"><\u002Frect><rect x=\"10\" y=\"56\" width=\"280\" height=\"3\" fill=\"#161414\"><\u002Frect><rect x=\"10\" y=\"62\" width=\"280\" height=\"14\" fill=\"url(#xx)\"><\u002Frect><rect x=\"10\" y=\"79\" width=\"280\" height=\"3\" fill=\"#161414\"><\u002Frect><\u002Fsvg><\u002Fdiv><div style=\"font-size:17px;font-weight:600;\">Zigue-zague e trançado<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">Geometria inspirada na pintura Kakusu, do povo Pataxó: o zigue-zague como energia e a faixa trançada como conexão. Use só como faixa fina, nunca como estampa de fundo nem na figura completa.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;\"><svg sc-camel-view-box=\"0 0 300 160\" width=\"300\" height=\"160\"><g stroke=\"#161414\" stroke-width=\"5\" stroke-linecap=\"round\"><path d=\"M70 30 V130\"><\u002Fpath><path d=\"M100 30 V100 L116 116 V130\"><\u002Fpath><\u002Fg><g fill=\"#161414\"><rect x=\"140\" y=\"62\" width=\"120\" height=\"36\" rx=\"6\"><\u002Frect><\u002Fg><g fill=\"#C8232C\"><circle cx=\"160\" cy=\"80\" r=\"5\"><\u002Fcircle><\u002Fg><path d=\"M178 80 H242\" stroke=\"#F7F4F1\" stroke-width=\"3\" stroke-dasharray=\"6 8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:17px;font-weight:600;\">Peças da placa<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">Terminais do LED, dispositivo com indicador vermelho e jumpers. Para diagramas técnicos: traço de 5 px, pontas arredondadas e dobras de 45°.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">Agroindústria e logística<\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px 20px;\"><div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;\"><svg sc-camel-view-box=\"0 0 300 200\" width=\"300\" height=\"200\"><g stroke=\"#161414\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M40 180 V78\" stroke-width=\"5\"><\u002Fpath><path d=\"M34 103.5 H46 M34 129 H46 M34 154.5 H46\" stroke-width=\"4\"><\u002Fpath><path d=\"M40 78 C36 52 20 40 8 54 M40 78 C44 48 62 38 74 56 M40 78 C41 58 42 44 44 32 M40 103.5 C48 91.5 58 89.5 66 97.5\" stroke-width=\"3\"><\u002Fpath><\u002Fg><g stroke=\"#161414\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M84 180 V58\" stroke-width=\"5\"><\u002Fpath><path d=\"M78 88.5 H90 M78 119 H90 M78 149.5 H90\" stroke-width=\"4\"><\u002Fpath><path d=\"M84 58 C80 32 64 20 52 34 M84 58 C88 28 106 18 118 36 M84 58 C85 38 86 24 88 12 M84 88.5 C92 76.5 102 74.5 110 82.5\" stroke-width=\"3\"><\u002Fpath><\u002Fg><g stroke=\"#161414\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M128 180 V88\" stroke-width=\"5\"><\u002Fpath><path d=\"M122 111 H134 M122 134 H134 M122 157 H134\" stroke-width=\"4\"><\u002Fpath><path d=\"M128 88 C124 62 108 50 96 64 M128 88 C132 58 150 48 162 66 M128 88 C129 68 130 54 132 42 M128 111 C136 99 146 97 154 105\" stroke-width=\"3\"><\u002Fpath><\u002Fg><g stroke=\"#C8232C\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M172 180 V52\" stroke 002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">Caminho pontilhado entre a usina e a oficina, com o caminhão no meio. O ponto vermelho é sempre o destino ou a última localização.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;\"><svg sc-camel-view-box=\"0 0 300 160\" width=\"300\" height=\"160\"><g fill=\"none\" stroke=\"#161414\" stroke-width=\"3.5\" stroke-linejoin=\"round\"><path d=\"M40 30 H92 L110 48 V130 H40 Z M92 30 V48 H110\"><\u002Fpath><path d=\"M54 70 H96 M54 84 H96 M54 98 H80\"><\u002Fpath><\u002Fg><path d=\"M58 112 V122 M64 112 V122 M68 112 V122 M74 112 V122 M78 112 V122 M84 112 V122\" stroke=\"#161414\" stroke-width=\"2\"><\u002Fpath><path d=\"M120 80 H180\" stroke=\"#C8232C\" stroke-width=\"3.5\" stroke-dasharray=\"0.1 10\" stroke-linecap=\"round\"><\u002Fpath><rect x=\"190\" y=\"58\" width=\"80\" height=\"44\" rx=\"12\" fill=\"#161414\"><\u002Frect><circle cx=\"208\" cy=\"80\" r=\"5\" fill=\"#C8232C\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div style=\"font-size:17px;font-weight:600;\">Nota fiscal ↔ dispositivo<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">A NF de remessa ligada ao dispositivo por uma linha pontilhada vermelha. Mostra que cada ciclo de manutenção tem uma nota e um rastreador.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#161414;border-radius:14px;height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;\"><svg sc-camel-view-box=\"0 0 300 160\" width=\"300\" height=\"160\"><path d=\"M0 80 H70 L86 64 H140 L156 80 H210 L226 96 H300\" fill=\"none\" stroke=\"#F7F4F1\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M110 64 V44 M180 80 V112 H196\" fill=\"none\" stroke=\"#F7F4F1\" stroke-width=\"3\"><\u002Fpath><circle cx=\"110\" cy=\"40\" r=\"6\" fill=\"#161414\" stroke=\"#F7F4F1\" stroke-width=\"3\"><\u002Fcircle><circle cx=\"202\" cy=\"112\" r=\"6\" fill=\"#161414\" stroke=\"#F7F4F1\" stroke-width=\"3\"><\u002Fcircle><circle cx=\"290\" cy=\"96\" r=\"6\" fill=\"#161414\" stroke=\"#C8232C\" stroke-width=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div style=\"font-size:17px;font-weight:600;\">Trilha de circuito<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">Trilha de placa com dobras de 45° e nós. Em fundo preto, a trilha fica branca e o último nó vermelho. Use como divisória ou para ligar o guará ao texto.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.55;color:#4A4441;max-width:760px;padding:14px 16px;background:#ECE9E5;border-radius:8px;\"><b>Sobre os grafismos originários:<\u002Fb> eles se inspiram na pintura Kakusu, do povo Pataxó, simplificada a formas básicas. Antes de qualquer uso público, apresentar a marca a representantes Pataxó, pedir autorização e dar o crédito neste guia. Não usar em produtos à venda sem esse acordo.<\u002Fdiv><\u002Fsection>\n  <section id=\"icones\" style=\"display:flex;flex-direction:column;gap:32px;padding:72px 0;border-top:1px solid #D6D1CC;\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">06 · Ícones<\u002Fdiv><h2 style=\"margin:0;font-size:40px;font-weight:600;line-height:1.05;\">Ícones de interface<\u002Fh2><p style=\"margin:0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.55;color:#4A4441;text-wrap:pretty;\">Grade de 48 px, traço de 3,5 px, pontas arredondadas, e no máximo um
