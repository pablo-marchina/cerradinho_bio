# CT43 (parcial): tela "Ultima posicao" sem posicao salva e com a idade em segundos e em
# minutos. Horas e dias exigem espera real longa, e a posicao restaurada exige reinicio com
# a NVS preservada; ficam fora deste cenario.
name: CT43 - ultima posicao no LCD
version: 1
steps:
  - set-control: { part-id: gps, control: fixValid, value: 0 }
  - wait-serial: '"type":"STATUS"'
  - delay: 500ms
  # NF -> prazo -> posicao.
  - set-control: { part-id: btn_avancar, control: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: btn_avancar, control: pressed, value: 0 }
  - delay: 300ms
  - set-control: { part-id: btn_avancar, control: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: btn_avancar, control: pressed, value: 0 }
  - delay: 300ms
  - take-screenshot: { part-id: lcd, save-to: ../../build/wokwi-ct/ct43-lcd-sem-fix.png }
  - set-control: { part-id: gps, control: fixValid, value: 1 }
  - wait-serial: '"type":"location_sample"'
  - set-control: { part-id: gps, control: fixValid, value: 0 }
  - delay: 5000ms
  - take-screenshot: { part-id: lcd, save-to: ../../build/wokwi-ct/ct43-lcd-segundos.png }
  # Mais de 60 s sem posicao nova; o LCD ja apagou, e o primeiro toque so o acende.
  - delay: 58000ms
  - set-control: { part-id: btn_avancar, control: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: btn_avancar, control: pressed, value: 0 }
  - delay: 300ms
  - take-screenshot: { part-id: lcd, save-to: ../../build/wokwi-ct/ct43-lcd-minutos.png }
  - delay: 500ms
