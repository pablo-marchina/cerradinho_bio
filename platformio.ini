[platformio]
default_envs = demo
src_dir = src/firmware
core_dir = .tools/platformio

[env]
platform = platformio/espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus @ 1.0.3
    marcoschwartz/LiquidCrystal_I2C @ 1.1.4
    knolleary/PubSubClient @ 2.8
build_flags = -Wall -Wextra
build_src_filter = +<main.cpp>

[env:demo]
build_flags = ${env.build_flags} -DDEMO_MODE=1

[env:weekly]
build_flags = ${env.build_flags} -DDEMO_MODE=0

; Placa fisica (DevKitC V4 na protoboard dupla): igual ao demo, com botoes no lugar das chaves.
[env:bancada]
build_flags = ${env.build_flags} -DDEMO_MODE=1 -DSWITCH_BUTTONS=1

; Montagem alternada da bancada: igual ao bancada, com 7 pinos trocados. Os demais ambientes
; seguem nos pinos antigos, entao o Wokwi e os CTs ja executados nao mudam.
; Pinos de boot: GPIO5 (CICLO), GPIO12 (buzzer) e GPIO15 (AUTORIZAR) influenciam a partida.
; Nao segure CICLO nem AUTORIZAR ao ligar, e nada pode puxar o GPIO12 para 3,3 V: com ele
; alto no boot, o ESP32 escolhe 1,8 V para a flash e nao parte.
[env:bancada-alternada]
build_flags = ${env.build_flags} -DDEMO_MODE=1 -DSWITCH_BUTTONS=1
    -DLCD_SCL_PIN=23 -DNETWORK_SWITCH_PIN=16 -DGPS_RX_PIN=36 -DPREVIOUS_BUTTON_PIN=32
    -DBUZZER_PIN=12 -DAUTHORIZE_BUTTON_PIN=15 -DCYCLE_BUTTON_PIN=5
