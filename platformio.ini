[platformio]
default_envs = demo
src_dir = src/firmware
core_dir = .tools/platformio

[env]
platform = platformio/espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus @ 1.0.3
    marcoschwartz/LiquidCrystal_I2C @ 1.1.4
    knolleary/PubSubClient @ 2.8
build_flags = -Wall -Wextra
build_src_filter = +<main.cpp>

[env:demo]
build_flags = ${env.build_flags} -DDEMO_MODE=1

[env:weekly]
build_flags = ${env.build_flags} -DDEMO_MODE=0

; Placa fisica (montagem alternada, pinagem padrao do config.h): botoes no lugar das chaves.
[env:bancada]
build_flags = ${env.build_flags} -DDEMO_MODE=1 -DSWITCH_BUTTONS=1

; Bancada na pinagem antiga, usada nos CT46 a CT69 da secao 3.4.2 (e no CT65, que precisa dos
; mesmos pinos): igual ao bancada, com os pinos do Wokwi.
[env:bancada-antiga]
build_flags = ${env.build_flags} -DDEMO_MODE=1 -DSWITCH_BUTTONS=1 ${pinos_wokwi.build_flags}

; Apelido do bancada, mantido para quem ja grava com este nome: a montagem alternada e a
; pinagem padrao do config.h (SCL 23, REDE 16, GNSS RX 36, VOLTAR 32, buzzer 12, AUTORIZAR 15,
; CICLO 5). Pinos de boot: GPIO5 (CICLO), GPIO12 (buzzer) e GPIO15 (AUTORIZAR) influenciam a
; partida. Nao segure CICLO nem AUTORIZAR ao ligar, e nada pode puxar o GPIO12 para 3,3 V: com
; ele alto no boot, o ESP32 escolhe 1,8 V para a flash e nao parte.
[env:bancada-alternada]
build_flags = ${env.build_flags} -DDEMO_MODE=1 -DSWITCH_BUTTONS=1
