<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="840" viewBox="0 0 740 420" role="img" aria-labelledby="title desc">
  <title id="title">Cinco Forças de Porter — CerradinhoBio</title>
  <desc id="desc">Infográfico das cinco forças competitivas para bioenergia e indústria sucroenergética, do ponto de vista da CerradinhoBio.</desc>
  <defs>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #20222a; }
      .label { font: 700 15px Arial, sans-serif; fill: #fff; }
      .rating { font: 700 11px Arial, sans-serif; letter-spacing: .7px; fill: #fff; }
      .body { font: 12px Arial, sans-serif; fill: #fff; }
      .center { font: 700 18px Arial, sans-serif; fill: #fff; }
      .foot { font: 10px Arial, sans-serif; fill: #525866; }
    </style>
  </defs>
  <rect width="740" height="420" fill="#fff"/>
  <text x="370" y="34" text-anchor="middle" class="title">Cinco Forças de Porter | CerradinhoBio</text>

  <rect x="36" y="68" width="318" height="138" rx="10" fill="#e9ad54"/>
  <text x="58" y="103" class="label">Poder dos fornecedores</text>
  <text x="58" y="124" class="rating">MÉDIO</text>
  <text x="58" y="148" class="body">
    <tspan x="58" dy="0">Cana, milho, fertilizantes e peças pressionam</tspan>
    <tspan x="58" dy="16">custos. Alternativas regionais, contratos e</tspan>
    <tspan x="58" dy="16">diversificação reduzem a dependência.</tspan>
  </text>

  <rect x="386" y="68" width="318" height="138" rx="10" fill="#ef7850"/>
  <text x="410" y="103" class="label">Ameaça de novos entrantes</text>
  <text x="410" y="124" class="rating">MÉDIA</text>
  <text x="440" y="148" class="body">
    <tspan x="440" dy="0">Capital e licenças elevam barreiras.</tspan>
    <tspan x="440" dy="14">Novos grupos podem entrar;</tspan>
    <tspan x="440" dy="14">expansões de incumbentes elevam</tspan>
    <tspan x="440" dy="14">rivalidade, não a ameaça de entrada.</tspan>
  </text>

  <rect x="36" y="218" width="318" height="138" rx="10" fill="#59a264"/>
  <text x="58" y="254" class="label">Ameaça de substitutos</text>
  <text x="58" y="275" class="rating">MÉDIA</text>
  <text x="58" y="299" class="body">
    <tspan x="58" dy="0">Gasolina, eletrificação e outras rotas de</tspan>
    <tspan x="58" dy="16">baixo carbono disputam energia. Mistura</tspan>
    <tspan x="58" dy="16">obrigatória e frota flex sustentam o etanol.</tspan>
  </text>

  <rect x="386" y="218" width="318" height="138" rx="10" fill="#8fbe62"/>
  <text x="410" y="254" class="label">Poder dos compradores</text>
  <text x="410" y="275" class="rating">MÉDIA</text>
  <text x="410" y="299" class="body">
    <tspan x="410" dy="0">Distribuidores e compradores de commodities</tspan>
    <tspan x="410" dy="16">negociam preço e volume. Diversificar produtos</tspan>
    <tspan x="410" dy="16">e canais amplia as opções de venda.</tspan>
  </text>

  <circle cx="370" cy="212" r="56" fill="#39a99d" stroke="#fff" stroke-width="7"/>
  <text x="370" y="205" text-anchor="middle" class="center">
    <tspan x="370" dy="0">Rivalidade</tspan>
    <tspan x="370" dy="22">ALTA</tspan>
  </text>
  <text x="370" y="390" text-anchor="middle" class="foot">Base: template oficial de cinco forças do Inteli | Conteúdo e adaptação: Grupo G01 (2026).</text>
</svg>
