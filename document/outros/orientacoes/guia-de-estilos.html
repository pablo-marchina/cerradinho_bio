W\" x=\"1184\" y=\"588\" width=\"32\" height=\"40\" transform=\"rotate(90 1200 608)\"><\u002Fuse><use href=\"#footW\" x=\"1248\" y=\"560\" width=\"32\" height=\"40\" transform=\"rotate(90 1264 580)\"><\u002Fuse><use href=\"#footW\" x=\"1312\" y=\"588\" width=\"32\" height=\"40\" transform=\"rotate(90 1328 608)\"><\u002Fuse><use href=\"#footW\" x=\"1376\" y=\"560\" width=\"32\" height=\"40\" transform=\"rotate(90 1392 580)\"><\u002Fuse><use href=\"#footW\" x=\"1440\" y=\"588\" width=\"32\" height=\"40\" transform=\"rotate(90 1456 608)\"><\u002Fuse><use href=\"#footW\" x=\"1504\" y=\"560\" width=\"32\" height=\"40\" transform=\"rotate(90 1520 580)\"><\u002Fuse><use href=\"#footW\" x=\"1568\" y=\"588\" width=\"32\" height=\"40\" transform=\"rotate(90 1584 608)\"><\u002Fuse><use href=\"#footW\" x=\"1632\" y=\"560\" width=\"32\" height=\"40\" transform=\"rotate(90 1648 580)\"><\u002Fuse><circle cx=\"200\" cy=\"600\" r=\"18\" fill=\"#C8232C\"><\u002Fcircle><text x=\"170\" y=\"720\" font-family=\"Fredoka, sans-serif\" font-size=\"44\" font-weight=\"600\" fill=\"#F7F4F1\" letter-spacing=\"0\" text-anchor=\"start\">MVP<\u002Ftext><text x=\"170\" y=\"780\" font-family=\"JetBrains Mono, monospace\" font-size=\"26\" font-weight=\"400\" fill=\"#D6D1CC\" letter-spacing=\"0\" text-anchor=\"start\">agora<\u002Ftext><circle cx=\"660\" cy=\"600\" r=\"18\" fill=\"#F7F4F1\"><\u002Fcircle><text x=\"630\" y=\"720\" font-family=\"Fredoka, sans-serif\" font-size=\"44\" font-weight=\"600\" fill=\"#F7F4F1\" letter-spacing=\"0\" text-anchor=\"start\">Piloto em oficinas<\u002Ftext><text x=\"630\" y=\"780\" font-family=\"JetBrains Mono, monospace\" font-size=\"26\" font-weight=\"400\" fill=\"#D6D1CC\" letter-spacing=\"0\" text-anchor=\"start\">fornecedores reais<\u002Ftext><circle cx=\"1120\" cy=\"600\" r=\"18\" fill=\"#F7F4F1\"><\u002Fcircle><text x=\"1090\" y=\"720\" font-family=\"Fredoka, sans-serif\" font-size=\"44\" font-weight=\"600\" fill=\"#F7F4F1\" letter-spacing=\"0\" text-anchor=\"start\">Integração com BI<\u002Ftext><text x=\"1090\" y=\"780\" font-family=\"JetBrains Mono, monospace\" font-size=\"26\" font-weight=\"400\" fill=\"#D6D1CC\" letter-spacing=\"0\" text-anchor=\"start\">API em produção<\u002Ftext><circle cx=\"1580\" cy=\"600\" r=\"18\" fill=\"#F7F4F1\"><\u002Fcircle><text x=\"1550\" y=\"720\" font-family=\"Fredoka, sans-serif\" font-size=\"44\" font-weight=\"600\" fill=\"#F7F4F1\" letter-spacing=\"0\" text-anchor=\"start\">Escala<\u002Ftext><text x=\"1550\" y=\"780\" font-family=\"JetBrains Mono, monospace\" font-size=\"26\" font-weight=\"400\" fill=\"#D6D1CC\" letter-spacing=\"0\" text-anchor=\"start\">todos os ativos<\u002Ftext><\u002Fsvg><\u002Fdiv><div style=\"font-size:17px;font-weight:600;\">Pitch · Próximos passos<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\">Roadmap sobre a trilha de pegadas. O ponto vermelho marca onde o projeto está.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n  <section id=\"arduino\" style=\"display:flex;flex-direction:column;gap:32px;padding:72px 0;border-top:1px solid #D6D1CC;\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">08 · Hardware<\u002Fdiv><h2 style=\"margin:0;font-size:40px;font-weight:600;line-height:1.05;\">No Arduino e no dispositivo<\u002Fh2><p style=\"margin:0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.55;color:#4A4441;text-wrap:pretty;\">A marca continua no aparelho. O LED físico segue os mesmos estados do guará, o monitor serial abre com o nome e a etiqueta da carcaça usa a versão em uma cor.<\u002Fp><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;padding:24px 26px;font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.7;white-space:pre;overflow-x:auto;color:#161414;\"><span style=\"color:#6B6460;\">// padrões de LED da marca Guarátracking<\u002Fspan><br><span style=\"color:#8F1820;\">const int<\u002Fspan> LED_GUARA = 13;<br><br><span style=\"color:#8F1820;\">void<\u002Fspan> ligado()       { digitalWrite(LED_GUARA, HIGH); }<br><span style=\"color:#8F1820;\">void<\u002Fspan> transmitindo() { pisca(700); }<br><span style=\"color:#8F1820;\">void<\u002Fspan> alerta()       { pisca(150); }<br><br><span style=\"color:#8F1820;\">void<\u002Fspan> pisca(<span style=\"color:#8F1820;\">int<\u002Fspan> ms) {<br>  digitalWrite(LED_GUARA, HIGH); delay(ms);<br>  digitalWrite(LED_GUARA, LOW);  delay(ms);<br>}<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\"><b>LED de status:<\u002Fb> LED vermelho de 5 mm, ligado ao pino 13. Os tempos de piscar são os da seção 02.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#161414;color:#F7F4F1;border-radius:14px;padding:24px 26px;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.7;white-space:pre;overflow-x:auto;\"><span style=\"color:#C8232C;\">  ●  GUARÁTRACKING<\u002Fspan>  v0.1\n  ─────────────────────────────\n  dispositivo   GT-0042\n  lacre         <span style=\"color:#3F7D4E;\">OK<\u002Fspan>\n  bateria       <span style=\"color:#D89B2B;\">68%<\u002Fspan>\n  último envio  2026-10-14 08:00\n  estado        <span style=\"color:#C8232C;\">TRANSMITINDO<\u002Fspan><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\"><b>Monitor serial:<\u002Fb> o cabeçalho com o nome, depois rótulo e valor alinhados. Caixa alta só para os estados.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"background:#F7F4F1;border-radius:14px;padding:30px;display:flex;justify-content:center;\"><div style=\"width:300px;height:150px;border-radius:22px;background:#161414;display:flex;align-items:center;gap:16px;padding:0 26px;position:relative;\"><div style=\"position:absolute;left:-16px;top:58px;width:30px;height:30px;border-radius:50%;border:6px solid #161414;\"><\u002Fdiv><svg sc-camel-view-box=\"0 0 110 140\" width=\"58\" height=\"74\"><use href=\"#c_led_onK\"><\u002Fuse><\u002Fsvg><div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:24px;font-weight:600;color:#F7F4F1;\">Guará<span style=\"color:#C8232C;font-weight:500;\">tracking<\u002Fspan><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#D6D1CC;letter-spacing:.08em;\">GT-0042 · NÃO REMOVER<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.45;color:#4A4441;text-wrap:pretty;\"><b>Etiqueta da carcaça:<\u002Fb> fundo preto, ícone, nome e o número do dispositivo. Gravação a laser ou impressão em uma cor, sempre com o tamanho mínimo de 8 mm para o ícone.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv><\u002Fsection>\n  <section id=\"site\" style=\"display:flex;flex-direction:column;gap:32px;padding:72px 0;border-top:1px solid #D6D1CC;\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">09 · Web<\u002Fdiv><h2 style=\"margin:0;font-size:40px;font-weight:600;line-height:1.05;\">Site e painel<\u002Fh2><p style=\"margin:0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.55;color:#4A4441;text-wrap:pretty;\">O mesmo sistema em tamanho menor. Cabeçalho claro com o logo 10b, a cor vermelha só nas ações principais e os estados do guará na tabela de dispositivos.<\u002Fp><\u002Fdiv>\n  <div style=\"background:#F7F4F1;border-radius:14px;overflow:hidden;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid #D6D1CC;flex-wrap:wrap;\"><div style=\"display:flex;align-items:flex-end;gap:3px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"31\" height=\"40\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><div style=\"margin-bottom:2px;\"><span style=\"font-size:18px;font-weight:600;line-height:1;letter-spacing:-.01em;color:#161414;white-space:nowrap;\">Guará<span style=\"font-weight:500;color:#C8232C;\">tracking<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:22px;font-family:'Atkinson Hyperlegible',sans-serif;font-size:15px;align-items:center;flex-wrap:wrap;\"><span>Dispositivos<\u002Fspan><span>Alertas<\u002Fspan><span>Relatórios<\u002Fspan><span style=\"background:#C8232C;color:#F7F4F1;padding:9px 16px;border-radius:999px;font-weight:700;\">Novo envio<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:24px 28px;display:flex;flex-direction:column;\">\n      <div style=\"display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.1fr);gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #ECE9E5;font-family:'Atkinson Hyperlegible',sans-serif;font-size:15px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"27\" height=\"34\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;\">GT-0042<\u002Fspan><span>Bomba centrífuga<\u002Fspan><span style=\"color:#6B6460;\">Oficina Ribeirão<\u002Fspan><span>12 dias<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#161414;font-weight:500;\">TRANSMITINDO<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.1fr);gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #ECE9E5;font-family:'Atkinson Hyperlegible',sans-serif;font-size:15px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"27\" height=\"34\" style=\"display:block;flex:none;\"><use href=\"#c_led\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;\">GT-0017<\u002Fspan><span>Motor 75 cv<\u002Fspan><span style=\"color:#6B6460;\">Fornecedor B<\u002Fspan><span>143 dias<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#D89B2B;font-weight:500;\">PERTO DO PRAZO<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.1fr);gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #ECE9E5;font-family:'Atkinson Hyperlegible',sans-serif;font-size:15px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"27\" height=\"34\" style=\"display:block;flex:none;\"><use href=\"#c_led_on\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;\">GT-0031<\u002Fspan><span>Redutor<\u002Fspan><span style=\"color:#6B6460;\">Fornecedor C<\u002Fspan><span>158 dias<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#C8232C;font-weight:500;\">PRAZO VENCIDO<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.1fr);gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #ECE9E5;font-family:'Atkinson Hyperlegible',sans-serif;font-size:15px;\"><svg sc-camel-view-box=\"0 0 110 140\" width=\"27\" height=\"34\" style=\"display:block;flex:none;\"><use href=\"#c_led_off\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;\">GT-0008<\u002Fspan><span>—<\u002Fspan><span style=\"color:#6B6460;\">Base<\u002Fspan><span>—<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#6B6460;font-weight:500;\">DESLIGADO<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fsection>\n  <section id=\"voz\" style=\"display:flex;flex-direction:column;gap:32px;padding:72px 0;border-top:1px solid #D6D1CC;\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">10 · Linguagem<\u002Fdiv><h2 style=\"margin:0;font-size:40px;font-weight:600;line-height:1.05;\">Tom de voz<\u002Fh2><p style=\"margin:0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.55;color:#4A4441;text-wrap:pretty;\">Claro e direto, como o painel de um equipamento. O guará é simpático, mas o texto é sério.<\u002Fp><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;\">\n    <div style=\"background:#F7F4F1;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:10px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3F7D4E;letter-spacing:.08em;\">ESCREVA<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.5;\">\"GT-0031 está há 158 dias no fornecedor C. O prazo era 150.\"<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4F1;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:10px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#C8232C;letter-spacing:.08em;\">EVITE<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.5;\">\"Ops! Parece que um equipamento voou para longe 🐦\"<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F7F4F1;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:10px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#6B6460;letter-spacing:.08em;\">NOME<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.5;\">Escreva sempre <b>Guarátracking<\u002Fb>, numa palavra, com acento. Em texto corrido não use caixa alta.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv><\u002Fsection>\n<section id=\"solarpunk\" style=\"display:flex;flex-direction:column;gap:32px;padding:72px 0;border-top:1px solid #D6D1CC;\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">11 · Cores de cena<\u002Fdiv><h2 style=\"margin:0;font-size:40px;font-weight:600;line-height:1.05;\">Paleta solarpunk<\u002Fh2><p style=\"margin:0;font-family:'Atkinson Hyperlegible',sans-serif;font-size:17px;line-height:1.55;color:#4A4441;text-wrap:pretty;\">As cenas juntam o vermelho do guará com o verde da lavoura e o turquesa da usina. Essas cores são só para ilustração e para as telas que aparecem dentro das cenas. A base da marca continua sendo vermelho, semente e polpa.<\u002Fp><\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">Céu · entardecer (padrão)<\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:16px;\"><div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\"><div style=\"height:110px;background:#9FCFCB;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#161414;\">#9FCFCB<\u002Fspan><\u002Fdiv><div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Céu alto<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Topo do degradê do céu.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\"><div style=\"height:110px;background:#F6D2C2;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#161414;\">#F6D2C2<\u002Fspan><\u002Fdiv><div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Céu baixo<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Meio do degradê, a 72% da altura do céu.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\"><div style=\"height:110px;background:#F2A795;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#161414;\">#F2A795<\u002Fspan><\u002Fdiv><div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Horizonte<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Faixa logo acima da lavoura.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\"><div style=\"height:110px;background:#F08A7C;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#161414;\">#F08A7C<\u002Fspan><\u002Fdiv><div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Coral<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Halo do sol a 35% e o \"tracking\" sobre verde-mar.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6460;\">Céu · manhã (alternativa)<\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:16px;\"><div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\"><div style=\"height:110px;background:#BFE3E0;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#161414;\">#BFE3E0<\u002Fspan><\u002Fdiv><div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Céu da manhã<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Topo do degradê com sol amarelo.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\"><div style=\"height:110px;background:#F6E7C2;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#161414;\">#F6E7C2<\u002Fspan><\u002Fdiv><div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Luz da manhã<\u002Fdiv><div style=\"font-family:'Atkinson Hyperlegible',sans-serif;font-size:13.5px;line-height:1.4;color:#4A4441;\">Meio do degradê.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#F7F4F1;\"><div style=\"height:110px;background:#F9D9B8;display:flex;align-items:flex-end;padding:14px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#161414;\">#F9D9B8<\u002Fspan><\u002Fdiv><div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-size:17px;font-weight:600;\">Hor
